# ============================================
# nginx-proxy Main Configuration
# Multi-Client Setup für Hetzner Server
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ✅ KRITISCH: events{} Block muss existieren!
# worker_rlimit_nofile: nginx -t warnte "2048 worker_connections exceed open
# file resource limit: 1024" (gemessen 20.09.2026 im laufenden Container:
# ulimit -Sn 1024, ulimit -Hn 524288). Der Wert hebt das weiche Limit der
# Worker unter das harte Limit; bei heutiger Last war die Warnung folgenlos.
worker_rlimit_nofile 4096;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Format
    # R-263 (askvalentinai-kommunikation, ROUTEN_INVENTAR_R231_2026-09-12.md
    # §12, S3-6): $host und $server_port am Ende angehängt, nicht
    # zwischengefügt — kein Auswerter im Repo (Infrastructure oder
    # askvalentinai-kommunikation) setzt auf der bisherigen Feldposition
    # auf, ein reines Anhängen ist trotzdem die sicherere Form.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$host:$server_port';

    access_log /var/log/nginx/access.log main;

    # Performance Optimierungen
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # SSL Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers (global)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Include site-specific configurations
    include /etc/nginx/conf.d/*.conf;
}
