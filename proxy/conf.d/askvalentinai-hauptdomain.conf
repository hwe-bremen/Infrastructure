# ═══════════════════════════════════════════════════════════════════════════════
# 🌐 ASKVALENTINAI HAUPTDOMAIN — askvalentinai.com und www.askvalentinai.com
# Port: 443 (HTTPS). Port 80 bedient der gemeinsame Block
# 00-port80-acme-und-redirect.conf (ACME-Challenge + Umleitung auf HTTPS).
# ═══════════════════════════════════════════════════════════════════════════════
# Zweck (2026-09-23): Die Startseite von AskValentinAI liegt bisher unter
# chat.askvalentinai.com/static/chat-ui/askvalentinai.html, und die Hauptdomain
# leitete per Cloudflare-Regel (302) dorthin um — die lange Adresse blieb in der
# Adresszeile stehen. Dieser Block liefert dieselbe Seite direkt unter der kurzen
# Adresse aus. Die Cloudflare-Weiterleitungsregel wird danach geloescht.
#
# Kern der Loesung: `location / { proxy_pass http://kommunikation-app/static/chat-ui/; }`
# — nginx ersetzt den getroffenen Praefix `/` durch `/static/chat-ui/` und haengt
# den Rest an. Aus `/css/main.css` wird `/static/chat-ui/css/main.css`. Die Seite
# laedt alle ihre Dateien relativ (gemessen 23.09.: css/, js/, assets/,
# unterseiten/, kein <base>-Element) und braucht deshalb KEINE Aenderung.
#
# M2-HAERTUNG (ADR-M2-001): X-AVI-Client-Id=kommunikation in jeder Location zu
# kommunikation-app gesetzt. nginx vererbt proxy_set_header nicht in
# Unter-Locations — fehlt die Zeile, reicht der Block einen mitgebrachten
# Client-Header ungefiltert weiter.
#
# Zonen: `chatai_chat` und `chatai_api` sind in chat-askvalentinai.conf auf
# http-Ebene definiert und gelten global. Bewusst wiederverwendet statt neu
# angelegt — gemeinsame Zaehler ueber beide Namen sind hier erwuenscht, es ist
# dieselbe Anwendung.
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl;
    http2 on;
    server_name askvalentinai.com www.askvalentinai.com;

    ssl_certificate /etc/letsencrypt/live/askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HauptdomainSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/hauptdomain_askvalentinai_access.log;
    error_log /var/log/nginx/hauptdomain_askvalentinai_error.log;

    # Gemeinsame Sperrliste aller Mandanten (R-231 Schritt 3, §12). Ohne sie
    # waeren /admin, /docs und die Fehlersuchpfade unter diesem Namen offen —
    # derselbe Fehler wie beim Shop-Chat-Block, gefunden am 12.09.
    include /etc/nginx/conf.d/sperrliste.inc;

    # ── Der Chat der Startseite. Gleiche Bauform wie in chat-askvalentinai.conf:
    #    Streaming, deshalb Pufferung aus und lange Lesezeit.
    location /chat {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_chat burst=10 nodelay;
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ── Auskunft fuer die Aussenueberwachung (wie bei den Mandanten).
    location = /health {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── Die Wurzel genau. Ohne diese Stelle wird aus `/` der Pfad
    #    `/static/chat-ui/` — ein Verzeichnis, fuer das die Anwendung keine
    #    Standarddatei ausliefert (gemessen 23.09., 09:21 UTC: 404 JSON,
    #    waehrend alle Unterpfade schon 200 lieferten). Der Praefix-Block
    #    unten deckt genau diesen einen Fall nicht ab.
    location = / {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_api burst=20 nodelay;
        proxy_pass http://kommunikation-app/static/chat-ui/askvalentinai.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ── Alles Uebrige ist die Startseite samt ihrer Dateien. Der Praefix `/`
    #    wird durch `/static/chat-ui/` ersetzt (siehe Kopf). Kein `expires`:
    #    die Seite ist im Aufbau, ein langer Zwischenspeicher wuerde jede
    #    Aenderung fuer Besucher verzoegern. Die CSS-Dateien tragen ohnehin
    #    eigene Versionsanhaengsel (?v=11).
    location / {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_api burst=20 nodelay;
        proxy_pass http://kommunikation-app/static/chat-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
