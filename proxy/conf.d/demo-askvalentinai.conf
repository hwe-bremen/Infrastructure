# ═══════════════════════════════════════════════════════════════════════════════
# 🗨️ DEMO (M2-TENANT) - nginx Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Port: 11443 (HTTPS) / 11080 (HTTP)  — wiederverwendet (bereits auf nginx-proxy gemappt)
# Domain: demo.askvalentinai.com
# Backend: kommunikation-app (GETEILTER M2-Container) — NICHT mehr demo-app!
# Identität: X-AVI-Client-Id=demo in jeder Location (ADR-M2-001)
# Scope Weg 1 (Hawe 2026-06-13): KEIN Admin/Streamlit, KEINE Observability,
#   KEIN /metrics, KEIN /api/router-mini/ (Control-Plane global → nicht auf demo).
# Legacy-Container demo-app bleibt als Notnagel (Route via .legacy-Datei reaktivierbar).
# ═══════════════════════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=demo_chat:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=demo_api:10m rate=20r/s;

server {
    listen 11080;
    server_name demo.askvalentinai.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host:11443$request_uri; }
}

server {
    listen 11443 ssl;
    http2 on;
    server_name demo.askvalentinai.com;

    ssl_certificate /etc/letsencrypt/live/demo.askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DemoSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/demo_askvalentinai_access.log;
    error_log /var/log/nginx/demo_askvalentinai_error.log;

    location /chat {
        proxy_set_header X-AVI-Client-Id demo;   # M2-Identität
        limit_req zone=demo_chat burst=10 nodelay;
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /api/chat {
        proxy_set_header X-AVI-Client-Id demo;   # M2-Identität
        limit_req zone=demo_chat burst=20 nodelay;
        proxy_pass http://kommunikation-app/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_set_header X-AVI-Client-Id demo;   # M2-Identität
        proxy_pass http://kommunikation-app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ── SEC-1 (2026-07-27) ──────────────────────────────────────────────────
    # Dieser Block proxyt auf denselben kommunikation-app-Container wie
    # chat.askvalentinai.com. routes/crawler.py wertet X-AVI-Client-Id NICHT
    # aus (kein Import von config.request_tenant) und loest ueber den
    # Prozess-Default auf — ein Rebuild ueber DIESE Domain loescht daher die
    # Daten von client_data/kommunikation, nicht die des hier gesetzten
    # Tenants. Deshalb faellt der Pfad auch hier, nicht nur am Hauptblock.
    # Kein proxy_pass noetig: deny greift, bevor weitergeleitet wird.
    location /api/crawler {
        deny all;
    }

    location /api/ {
        proxy_set_header X-AVI-Client-Id demo;   # M2-Identität
        limit_req zone=demo_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_set_header X-AVI-Client-Id demo;   # harmlos/safe
        proxy_pass http://kommunikation-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /chat-widget/ {
        proxy_set_header X-AVI-Client-Id demo;   # M2-Identität
        proxy_pass http://kommunikation-app/chat-widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat-ui/ {
        proxy_set_header X-AVI-Client-Id demo;   # M2-Identität (primäres Demo-Frontend)
        proxy_pass http://kommunikation-app/chat-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /static/ {
        proxy_set_header X-AVI-Client-Id demo;   # M2-Identität
        proxy_pass http://kommunikation-app/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_set_header X-AVI-Client-Id demo;   # M2-Identität (catch-all)
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
