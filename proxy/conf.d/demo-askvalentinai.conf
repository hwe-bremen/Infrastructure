# ═══════════════════════════════════════════════════════════════════════════════
# 📋 DOKU-SPIEGELUNG — nicht Source-of-Truth
# ═══════════════════════════════════════════════════════════════════════════════
#
# Diese Datei ist eine REPO-DOKU der nginx-Konfig für demo.askvalentinai.com.
# Die Source-of-Truth liegt im separaten `infrastructure`-Repo unter dem
# Pfad `proxy/conf.d/demo-askvalentinai.conf`. Auf der Hetzner-VM wird sie
# als Volume-Mount eingebunden: /root/infrastructure/proxy/conf.d/ →
# nginx-proxy:/etc/nginx/conf.d/.
#
# Pflege-Workflow (Hawe-Pattern):
#   1. Lokal im `infrastructure`-Repo (Mac) editieren
#   2. Commit + Push nach GitHub
#   3. Auf Hetzner-VM: cd /root/infrastructure && git pull
#   4. nginx-Reload: docker exec nginx-proxy nginx -s reload
#
# Diese Datei hier MUSS bei jeder Änderung am echten infrastructure-Repo
# manuell mitgepflegt werden. Drift-Vermeidung: pro Änderung Pflege-
# Vermerk in readme/_active/STEP_D-B_TEST_PROTOKOLL_2026-05-17.md.
#
# Anlass der Erstellung: ARBEITSPLAN_DEMO_APP_HOFMANN_DE_2026-05-17.md
#                        Phase D-B (BRIEFING_D-B_NGINX_SSL_2026-05-17.md)
# ═══════════════════════════════════════════════════════════════════════════════
#
# 🗨️ DEMO-APP - nginx Configuration
# Port: 11443 (HTTPS) / 11080 (HTTP)
# Domain: demo.askvalentinai.com (via Cloudflare DNS-only)
# Cert: /etc/letsencrypt/live/demo.askvalentinai.com/ (DNS-01-Challenge, manual renew)
# Backend: demo-app (Container im chat_net + proxy_net)
#
# Bewusste Reduktion gegenüber chat-askvalentinai.conf:
#   - KEIN /admin/, /admin/_stcore/* (Sicherheits-Festlegung Hawe 2026-05-17:
#     Admin-Panel nicht öffentlich, nur via SSH-Port-Forward 8515 erreichbar)
#   - KEIN /grafana/, /prometheus/, /monitor/ (demo hat keinen Observability-Stack)
#   - KEIN /static/css/monitor/, /static/js/monitor/ (dito)
#
# Eigene rate-limit-Zonen (Konflikt-Vermeidung mit chat-Block):
#   - demo_chat  (statt chatai_chat)
#   - demo_api   (statt chatai_api)
# ═══════════════════════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=demo_chat:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=demo_api:10m rate=20r/s;

server {
    listen 11080;
    server_name demo.askvalentinai.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host:11443$request_uri; }
}

server {
    listen 11443 ssl;
    http2 on;
    server_name demo.askvalentinai.com;

    ssl_certificate /etc/letsencrypt/live/demo.askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DemoSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/demo_askvalentinai_access.log;
    error_log /var/log/nginx/demo_askvalentinai_error.log;

    # ────────────────────────────────────────────────────────────────────
    # Chat-Pfad (Demo-Frontend)
    # ────────────────────────────────────────────────────────────────────
    location /chat {
        limit_req zone=demo_chat burst=10 nodelay;
        proxy_pass http://demo-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ────────────────────────────────────────────────────────────────────
    # API-Pfade
    # ────────────────────────────────────────────────────────────────────
    location /api/router-mini/ {
        limit_req zone=demo_api burst=30 nodelay;
        proxy_pass http://demo-app/api/router-mini/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/chat {
        limit_req zone=demo_chat burst=20 nodelay;
        proxy_pass http://demo-app/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://demo-app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    location /api/ {
        limit_req zone=demo_api burst=30 nodelay;
        proxy_pass http://demo-app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ────────────────────────────────────────────────────────────────────
    # Health / Metrics (für externe Monitor-Pings, falls künftig nötig)
    # ────────────────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://demo-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /metrics {
        proxy_pass http://demo-app/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ────────────────────────────────────────────────────────────────────
    # Chat-Widget + Chat-UI
    # ────────────────────────────────────────────────────────────────────
    location /chat-widget/ {
        proxy_pass http://demo-app/chat-widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat-ui/ {
        proxy_pass http://demo-app/chat-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /static/ {
        proxy_pass http://demo-app/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ────────────────────────────────────────────────────────────────────
    # Default-Pfad (Root)
    # ────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://demo-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
