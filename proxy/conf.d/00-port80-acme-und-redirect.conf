# ═══════════════════════════════════════════════════════════════════════════════
# Port 80 — ACME-Challenge und Redirect auf HTTPS (§13 im Routen-Inventar,
# ROUTEN_INVENTAR_R231_2026-09-12.md, S4-1)
# ═══════════════════════════════════════════════════════════════════════════════
# Warum die frühe Position (00-…) hier richtig ist, anders als bei
# `zz-upstreams-kommunikation.conf` (W-6, §10.7 desselben Dokuments): W-6
# hält fest, dass die Ladereihenfolge bedeutungstragend ist, weil eine Datei
# etwas BEREITSTELLEN kann, das eine andere braucht (upstream, map, geo,
# log_format, limit_req_zone, proxy_cache_path) — steht die Nutzung vor der
# Definition, lehnt nginx ab. Dieser Block definiert nichts dergleichen; er
# hat nur zwei Regeln in einem eigenen `server{}` und ist von keinem anderen
# Block referenziert. `server_name _` ist deshalb unproblematisch früh: es
# ist keine feste nginx-Direktive, sondern nur ein Name ohne Sonderrolle —
# der erste `server`-Block, der für einen Port sonst nicht passt, wird zum
# Default. Stünde dieser Block dagegen SPÄTER als ein Mandantenblock mit
# `listen 80;` (den es heute nicht gibt), könnte ein alphabetisch früherer
# Mandant den Vorrang für unbekannte Hostnamen gewinnen, statt dieser
# bewusst generischen Regel. Die frühe Position sichert also die eigene
# Absicht, sie verletzt nicht die W-6-Lehre.
#
# Rückweg (Q-5): siehe proxy/certbot/README.md §7.
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
