# ═══════════════════════════════════════════════════════════════════════════════
# 🗨️ ASKVALENTINAI-CHAT - nginx Configuration
# Port: 10443 (HTTPS) / 10080 (HTTP)
# Domain: chat.askvalentinai.com (via Cloudflare DNS)
# M2-HAERTUNG 2026-06-13 (ADR-M2-001): X-AVI-Client-Id=kommunikation direkt in
# jeder kommunikation-app-Location gesetzt (ueberschreibt jeden Client-Header).
# Rueckwaertskompatibel: App ignoriert den Header solange TENANT_RESOLUTION_MODE=env.
# ═══════════════════════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=chatai_chat:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chatai_api:10m rate=20r/s;

server {
    listen 10080;
    server_name chat.askvalentinai.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host:10443$request_uri; }
}

server {
    listen 10443 ssl;
    listen 443 ssl;
    http2 on;
    server_name chat.askvalentinai.com;

    ssl_certificate /etc/letsencrypt/live/chat.askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ChatAISSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/chat_askvalentinai_access.log;
    error_log /var/log/nginx/chat_askvalentinai_error.log;

    # R-231 Schritt 3 (§12): gemeinsame Sperrliste für alle vier Mandanten.
    include /etc/nginx/conf.d/sperrliste.inc;

    # 2026-09-22 (Firewall Stufe 2): Ziel ohne Port. Vorher $scheme://$host:10443/…
    # — nach Schliessen der Alt-Ports in der Hetzner Cloud Firewall fuehrte
    # /admin (ohne Schraegstrich) sonst auf einen gefilterten Port
    # (gemessen 22.09.: 301 -> https://chat.askvalentinai.com:10443/admin/).
    location = /monitor  { return 301 https://$host/monitor/; }
    location = /grafana  { return 301 https://$host/grafana/; }
    location = /prometheus { return 301 https://$host/prometheus/; }
    location = /admin    { return 301 https://$host/admin/; }

    location /chat {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_chat burst=10 nodelay;
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ── tenant-neutral: kein Tenant-Resolve, KEINE Injektion ────────────────
    location /monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/css/monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /static/js/monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /grafana/ {
        proxy_pass http://kommunikation-grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        proxy_pass http://kommunikation-grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # R-130/R-231 Schritt 3: /prometheus/-Sperre steht jetzt in
    # sperrliste.inc (gemeinsame Sperrliste, siehe dort für die volle
    # Begründung — Warnung eingeschlossen).

    location /api/router-mini/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/router-mini/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/chat {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_chat burst=20 nodelay;
        proxy_pass http://kommunikation-app/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        proxy_pass http://kommunikation-app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # R-231 Schritt 3: /api/crawler, /api/high-level, /api/anthropic-test,
    # /api/openai-test — Sperren stehen jetzt in sperrliste.inc (SEC-1,
    # SEC-2, R-230, R-242, siehe dort).

    location /api/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2 (harmlos/safe)
        proxy_pass http://kommunikation-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # R-231 Schritt 3: /api/admin, /debug, /docs, /redoc, /openapi.json,
    # /metrics — Sperren stehen jetzt in sperrliste.inc (R-141, R-137,
    # siehe dort). Abweichung gegenüber vorher (Rückmeldung R-231 §12.4,
    # P-9): /metrics erlaubte hier bislang 172.20.0.0/16 und 127.0.0.1 mit
    # echtem proxy_pass durch — dieser Weg über den Proxy entfällt jetzt
    # vollständig (Prometheus nutzte ihn nie, siehe Herkunfts-Kommentar in
    # sperrliste.inc).

    location /chat-widget/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        proxy_pass http://kommunikation-app/chat-widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat-ui/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        proxy_pass http://kommunikation-app/chat-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /static/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        proxy_pass http://kommunikation-app/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── ACP / MCP Dashboard (:8503) — M2: X-AVI-Client-Id explizit injiziert
    #    (nicht additiv vererbt, ADR-M2-001). Tenant-Resolution des Dashboards
    #    selbst ist separates Work-Item (Control-Plane-Tenancy, ADR-CONTROL-PLANE-TENANCY-001).
    # R-231 Schritt 3: die /admin/cronjobs-Sperre (SEC-2, 2026-08-09) steht
    # jetzt in sperrliste.inc.

    location /admin/acp/_stcore/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-acp/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /admin/acp/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-acp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Streamlit Admin Panel (:8502) — Injektion belt-and-suspenders;
    # Streamlit liest den Header NICHT, Admin bleibt prozess-global
    # (Control-Plane-Tenancy = separates Work-Item, NICHT dieser Test).
    location /admin/_stcore/stream {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /admin/_stcore/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/stream {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /admin/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /component/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/component/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität (catch-all)
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
