# ═══════════════════════════════════════════════════════════════════════════════
# 🗨️ ASKVALENTINAI-CHAT - nginx Configuration
# Port: 10443 (HTTPS) / 10080 (HTTP)
# Domain: chat.askvalentinai.com (via Cloudflare DNS)
# M2-HAERTUNG 2026-06-13 (ADR-M2-001): X-AVI-Client-Id=kommunikation direkt in
# jeder kommunikation-app-Location gesetzt (ueberschreibt jeden Client-Header).
# Rueckwaertskompatibel: App ignoriert den Header solange TENANT_RESOLUTION_MODE=env.
# ═══════════════════════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=chatai_chat:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chatai_api:10m rate=20r/s;

server {
    listen 10080;
    server_name chat.askvalentinai.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host:10443$request_uri; }
}

server {
    listen 10443 ssl;
    http2 on;
    server_name chat.askvalentinai.com;

    ssl_certificate /etc/letsencrypt/live/chat.askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ChatAISSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/chat_askvalentinai_access.log;
    error_log /var/log/nginx/chat_askvalentinai_error.log;

    location = /monitor  { return 301 $scheme://$host:10443/monitor/; }
    location = /grafana  { return 301 $scheme://$host:10443/grafana/; }
    location = /prometheus { return 301 $scheme://$host:10443/prometheus/; }
    location = /admin    { return 301 $scheme://$host:10443/admin/; }

    location /chat {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_chat burst=10 nodelay;
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ── tenant-neutral: kein Tenant-Resolve, KEINE Injektion ────────────────
    location /monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/css/monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /static/js/monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /grafana/ {
        proxy_pass http://kommunikation-grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        proxy_pass http://kommunikation-grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── R-130 (2026-08-19): Prometheus bleibt zu, absichtlich ───────────────
    # Dieser Weg hat NIE funktioniert: Der Container laeuft mit
    # `--web.route-prefix=/` (docker-compose.proxy.yml:138), der proxy_pass
    # stand ohne abschliessenden Schraegstrich — `/prometheus/api/...` kam
    # unveraendert an und lief ins Leere. Gemessen 2026-08-19: HTTP 404.
    #
    # Er wird NICHT repariert, sondern geschlossen. Prometheus kennt keine
    # Anmeldung; seine 30-Tage-Historie traegt Mandantenkennungen. Der
    # Direktport 9096 ist seit R-130 an 127.0.0.1 gebunden — diese Location
    # waere sonst der verbliebene Weg von aussen.
    #
    # ⚠️  WER DIESEN BLOCK "REPARIERT", OEFFNET DIE METRIK-HISTORIE INS NETZ.
    #
    # Gemessen wird stattdessen containerintern:
    #   docker exec kommunikation-app python3 -c "... http://prometheus:9090 ..."
    # oder ueber einen SSH-Tunnel: ssh -L 9096:127.0.0.1:9096 root@<host>
    location /prometheus/ {
        deny all;
    }
    # ────────────────────────────────────────────────────────────────────────

    location /api/router-mini/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/router-mini/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/chat {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_chat burst=20 nodelay;
        proxy_pass http://kommunikation-app/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        proxy_pass http://kommunikation-app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ── SEC-1 (2026-07-27) ──────────────────────────────────────────────────
    # POST /api/crawler/rebuild loescht Crawler-Embeddings, crawled_data/ und
    # FAISS-Index des Tenants ohne Rollback und war unauthentifiziert aus dem
    # offenen Netz erreichbar (extern verifiziert: 200 auf /api/crawler/stats).
    # Einziger legitimer Konsument ist das Admin-Panel IM kommunikation-app-
    # Container ueber localhost:8000 (API_BASE_URL ist ungesetzt, Default in
    # admin/components/crawler_manager.py:19) — der Weg laeuft nicht ueber nginx
    # und ist von dieser Regel nicht betroffen.
    # Kein proxy_pass noetig: deny greift, bevor weitergeleitet wird.
    # Ohne abschliessenden Slash, damit auch /api/crawler selbst faellt.
    # Nur Tourniquet — der dauerhafte Fix ist verify_admin_token an der Route
    # (Auflage A-2 im Verdikt, askvalentinai-kommunikation:
    # readme/architektur/reviews/PRUEFAUFTRAG_CRAWLER_REBUILD_ENDPOINT_AUTHZ_2026-07-27.md)
    location /api/crawler {
        deny all;
    }

    location /api/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        limit_req zone=chatai_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2 (harmlos/safe)
        proxy_pass http://kommunikation-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /metrics {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2 (harmlos/safe)
        proxy_pass http://kommunikation-app/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /chat-widget/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        proxy_pass http://kommunikation-app/chat-widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat-ui/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        proxy_pass http://kommunikation-app/chat-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /static/ {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität
        proxy_pass http://kommunikation-app/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── ACP / MCP Dashboard (:8503) — M2: X-AVI-Client-Id explizit injiziert
    #    (nicht additiv vererbt, ADR-M2-001). Tenant-Resolution des Dashboards
    #    selbst ist separates Work-Item (Control-Plane-Tenancy, ADR-CONTROL-PLANE-TENANCY-001).
    # SEC-2 (2026-08-09): unauthentifizierter Zugriff extern belegt.
    # Kein proxy_pass noetig: deny greift vor der Weiterleitung.
    location /admin/cronjobs {
        deny all;
    }

    location /admin/acp/_stcore/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-acp/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /admin/acp/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-acp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Streamlit Admin Panel (:8502) — Injektion belt-and-suspenders;
    # Streamlit liest den Header NICHT, Admin bleibt prozess-global
    # (Control-Plane-Tenancy = separates Work-Item, NICHT dieser Test).
    location /admin/_stcore/stream {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /admin/_stcore/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/stream {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /admin/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /component/ {
        proxy_set_header X-AVI-Client-Id kommunikation;
        proxy_pass http://kommunikation-app:8502/component/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_set_header X-AVI-Client-Id kommunikation;   # M2-Identität (catch-all)
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
