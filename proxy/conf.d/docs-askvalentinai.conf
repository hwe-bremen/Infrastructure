# docs-content/ (der HOST-Pfad des neuen :ro-Volume-Mounts, siehe
# infrastructure-docker-compose.diff -- NICHT der Container-Pfad
# /var/www/askvalentinai-docs, den rsync gar nicht erreichen kann). Details
# und Rollback in readme/job3/ROLLOUT_STUFE_B.md.
