# ═══════════════════════════════════════════════════════════════════════════════
# ENTWURF — NICHT ANGEWENDET (Job 3, §3.1, Stufe B)
# ═══════════════════════════════════════════════════════════════════════════════
# Diese Datei ist ein Vorschlag, kein aktiver Server-Block. Sie liegt im
# Docs-Repo (askvalentinai-docs/deploy/), NICHT im Infrastructure-Repo --
# dort besteht nur Lesezugriff. Cowork hat sie weder eingespielt noch gegen
# einen Server getestet (keine Server-Verbindung, kein SSH).
#
# KORRIGIERT 2026-08-22 (Stufe B, Topologie-Fund aus dem eigenen Job-3-Lauf).
# Die vorherige Fassung dieser Datei ging von Standardports 80/443 aus und
# war damit falsch fuer die reale Topologie -- der Hinweis dazu stand bereits
# am Ende von nginx-docs-stufe-a-test.conf.entwurf. Diese Fassung ersetzt sie
# vollstaendig (nicht nur als Anhang), weil ein Entwurf, der auf falschen
# Ports aufsetzt, keine brauchbare Referenz mehr ist -- anders als der
# Auth-Befund (dort war der SCHLUSS falsch, hier ist es die AUSGANGS-
# ANNAHME). Massgeblich jetzt:
#   - Portpaar 13080/13443 (naechstes freie Paar nach dem IKH-Slot 12080/
#     12443 -- bestaetigt frei in Infrastructure/proxy/docker-compose.yml,
#     nur gelesen, siehe deploy/infrastructure-docker-compose.diff)
#   - Port 80 und 443 bleiben auf dem Host UNGEMAPPT (kein Container haelt
#     sie) -- genau deshalb kann certbot certonly --standalone Port 80
#     kurzzeitig selbst belegen, OHNE mit nginx-proxy zu kollidieren. Dieser
#     Server-Block braucht deshalb KEINE
#     `location /.well-known/acme-challenge/ { root /var/www/certbot; }` --
#     anders als chat/demo/ikh (die diese Location fuehren, weil sie ueber
#     ihre eigenen X080-Ports laufen). Der Zertifikatsbezug fuer die Docs-
#     Zone läuft vollständig ausserhalb des Containers, unabhaengig vom
#     13080/13443-Portpaar.
#   - Zielverzeichnis im Container: /var/www/askvalentinai-docs (per neuem,
#     read-only gemountetem Volume -- siehe Diff-Datei; rsync schreibt auf
#     den HOST-Pfad des Mounts, nicht in den Container hinein)
#   - Zertifikat ueber `certbot certonly --standalone`, NICHT Webroot (siehe
#     oben) -- Rollout-Sequenz in readme/job3/ROLLOUT_STUFE_B.md
#
# Zweistufiger Ablauf, von Hawes Hand (Stufe A bereits durchgefuehrt und
# positiv -- siehe deploy/AUTH-BEFUND-3.0.md, "Richtigstellung"):
#   Stufe A (Auth-Beleg, §3.0) -- ABGESCHLOSSEN, POSITIV. §3.0 ist positiv
#     belegt, Stufe B ist frei (siehe readme/job3/TESTPROTOKOLL_JOB3.md).
#   Stufe B (Auslieferung, §3.1) -- DIESER Block, plus der docker-compose-
#     Diff, plus die Rollout-Sequenz. Schritt-fuer-Schritt-Ausfuehrung in
#     readme/job3/ROLLOUT_STUFE_B.md, inklusive Abbruchkriterien je Schritt.
#
# Domain: docs.askvalentinai.com (§3.1) -- A-Record wird gesetzt (Rollout-
#   Sequenz, Schritt 1).
# Zielverzeichnis: /var/www/askvalentinai-docs (statisches HTML, per rsync
#   aus _site/ befuellt -- package.json "deploy", unveraendert aus Durchgang
#   1 uebernommen, siehe Hinweis am Dateiende).
# Unterschied zum khj-Block (proxy/conf.d/ikh-askvalentinai.conf): kein
# Backend-Container, kein proxy_pass -- diese Site ist reines, vorgebautes
# HTML. nginx serviert nur Dateien.
#
# Bewusste Design-Entscheidung gegen den §3.0-Fehlschluss: Dieser Block
# kombiniert `auth_basic` an KEINER Stelle mit `return` oder
# `rewrite ... last` in derselben Location -- genau das Muster, das im
# Stufe-A-Testblock den stillen Bypass erzeugte (Rewrite-Phase vor Access-
# Phase, siehe AUTH-BEFUND-3.0.md). Die Auslieferung hier ist reines
# Datei-Serving (`root` + `try_files`, Content-Phase, NACH der Access-Phase)
# -- exakt die Konstruktion, die der Gegentest als funktionierend bestaetigt
# hat. Der HTTP->HTTPS-Redirect (`return 301 https://...`) hat dagegen KEIN
# `auth_basic` in seiner Location -- also keine Wiederholung des Musters.
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 13080;
    server_name docs.askvalentinai.com;

    # Keine /.well-known/acme-challenge/-Location noetig -- certbot
    # certonly --standalone validiert ueber Port 80 direkt am Host,
    # unabhaengig von diesem Server-Block (siehe Kommentar oben).
    location / { return 301 https://$host:13443$request_uri; }
}

server {
    listen 13443 ssl;
    http2 on;
    server_name docs.askvalentinai.com;

    ssl_certificate     /etc/letsencrypt/live/docs.askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DocsSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Testphasen-Schutz, analog khj/demo -- Doku ist noch nicht fuer die
    # Suchmaschinen-Indexierung gedacht.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── Basic-Auth, einziges Vertraulichkeitsmittel dieser Zone (§3.0) ──────
    # Stufe A hat bestaetigt: funktioniert korrekt mit APR1, SOLANGE
    # auth_basic nicht neben return/rewrite...last in derselben Location
    # steht (siehe Design-Hinweis oben). Dieser Block serviert ausschliess-
    # lich echte Dateien -- kein struktureller Bypass moeglich.
    # htpasswd-Erzeugung: `openssl passwd -apr1`, INTERAKTIV (fragt nach dem
    # Passwort). Landet von Hand in /etc/nginx/conf.d/htpasswd_docs auf der
    # VM (Host-Pfad: /root/infrastructure/proxy/conf.d/htpasswd_docs, da
    # conf.d :ro in den Container gemountet ist), NIE im Repo -- exakt
    # dieselbe Konvention wie htpasswd_ikh und der Stufe-A-Test.
    # AUSDRUECKLICH NICHT `htpasswd -B` (bcrypt) -- siehe deploy/
    # AUTH-BEFUND-3.0.md.
    auth_basic           "AskValentinAI Doku";
    auth_basic_user_file /etc/nginx/conf.d/htpasswd_docs;

    access_log /var/log/nginx/docs_askvalentinai_access.log;
    error_log  /var/log/nginx/docs_askvalentinai_error.log;

    root /var/www/askvalentinai-docs;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

