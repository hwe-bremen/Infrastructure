# ═══════════════════════════════════════════════════════════════════════════════
# 🗨️ ASKVALENTINAI-CHAT - nginx Configuration
# Port: 10443 (HTTPS) / 10080 (HTTP)
# Domain: askvalentinai-chat.duckdns.org
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# RATE LIMITING ZONES
# ═══════════════════════════════════════════════════════════════════════════════
limit_req_zone $binary_remote_addr zone=chat_chat:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chat_api:10m rate=20r/s;

# ═══════════════════════════════════════════════════════════════════════════════
# UPSTREAM DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════════
upstream kommunikation-app {
    server kommunikation-app:8000;
    keepalive 32;
}

upstream kommunikation-streamlit {
    server kommunikation-app:8502;
    keepalive 8;
}

upstream kommunikation-acp {
    server kommunikation-app:8503;
    keepalive 8;
}


upstream kommunikation-grafana {
    server kommunikation-grafana:3000;
    keepalive 8;
}

upstream kommunikation-prometheus {
    server kommunikation-prometheus:9090;
    keepalive 8;
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTP SERVER (Port 10080) - Redirect to HTTPS
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 10080;
    server_name askvalentinai-chat.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:10443$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTPS SERVER (Port 10443) - Main Configuration
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 10443 ssl;
    http2 on;
    server_name askvalentinai-chat.duckdns.org;

    # ═══════════════════════════════════════════════════════════════════════════
    # SSL Configuration
    # ═══════════════════════════════════════════════════════════════════════════
    ssl_certificate /etc/letsencrypt/live/askvalentinai-chat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askvalentinai-chat.duckdns.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ChatSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ═══════════════════════════════════════════════════════════════════════════
    # Security Headers
    # ═══════════════════════════════════════════════════════════════════════════
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ═══════════════════════════════════════════════════════════════════════════
    # Logging
    # ═══════════════════════════════════════════════════════════════════════════
    access_log /var/log/nginx/chat_access.log;
    error_log /var/log/nginx/chat_error.log;

    # ═══════════════════════════════════════════════════════════════════════════
    # TRAILING SLASH REDIRECTS
    # ═══════════════════════════════════════════════════════════════════════════
    location = /monitor {
        return 301 $scheme://$host:10443/monitor/;
    }

    location = /grafana {
        return 301 $scheme://$host:10443/grafana/;
    }

    location = /prometheus {
        return 301 $scheme://$host:10443/prometheus/;
    }

    location = /admin {
        return 301 $scheme://$host:10443/admin/;
    }

    location = /admin/acp {
        return 301 $scheme://$host:10443/admin/acp/;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # CHAT ENDPOINT (Streaming) - KRITISCH!
    # ═══════════════════════════════════════════════════════════════════════════
    location /chat {
        limit_req zone=chat_chat burst=10 nodelay;
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # MONITOR ROUTES (BEFORE /static/)
    # ═══════════════════════════════════════════════════════════════════════════
    location /monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/css/monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /static/js/monitor/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # GRAFANA
    # ═══════════════════════════════════════════════════════════════════════════
    location /grafana/ {
        proxy_pass http://kommunikation-grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grafana/api/live/ {
        proxy_pass http://kommunikation-grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # PROMETHEUS
    # ═══════════════════════════════════════════════════════════════════════════
    # ── R-130 (2026-08-19): Prometheus bleibt zu, absichtlich ───────────────
    # Dieser Weg hat NIE funktioniert: Der Container laeuft mit
    # `--web.route-prefix=/` (docker-compose.proxy.yml:138), der proxy_pass
    # stand ohne abschliessenden Schraegstrich — `/prometheus/api/...` kam
    # unveraendert an und lief ins Leere. Gemessen 2026-08-19: HTTP 404.
    #
    # Er wird NICHT repariert, sondern geschlossen. Prometheus kennt keine
    # Anmeldung; seine 30-Tage-Historie traegt Mandantenkennungen. Der
    # Direktport 9096 ist seit R-130 an 127.0.0.1 gebunden — diese Location
    # waere sonst der verbliebene Weg von aussen.
    #
    # ⚠️  WER DIESEN BLOCK "REPARIERT", OEFFNET DIE METRIK-HISTORIE INS NETZ.
    #
    # Gemessen wird stattdessen containerintern:
    #   docker exec kommunikation-app python3 -c "... http://prometheus:9090 ..."
    # oder ueber einen SSH-Tunnel: ssh -L 9096:127.0.0.1:9096 root@<host>
    location /prometheus/ {
        deny all;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # ROUTER-MINI API (BEFORE /api/)
    # ═══════════════════════════════════════════════════════════════════════════
    location /api/router-mini/ {
        limit_req zone=chat_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/router-mini/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # CHAT API (with streaming support)
    # ═══════════════════════════════════════════════════════════════════════════
    location /api/chat {
        limit_req zone=chat_chat burst=20 nodelay;
        proxy_pass http://kommunikation-app/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # WEBSOCKET
    # ═══════════════════════════════════════════════════════════════════════════
    location /ws/ {
        proxy_pass http://kommunikation-app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # GENERAL API
    # ═══════════════════════════════════════════════════════════════════════════
    # ── SEC-1 (2026-07-27) ──────────────────────────────────────────────────
    # POST /api/crawler/rebuild loescht Crawler-Embeddings, crawled_data/ und
    # FAISS-Index des Tenants ohne Rollback und war unauthentifiziert aus dem
    # offenen Netz erreichbar (extern verifiziert: 200 auf /api/crawler/stats).
    # Einziger legitimer Konsument ist das Admin-Panel IM kommunikation-app-
    # Container ueber localhost:8000 (API_BASE_URL ist ungesetzt, Default in
    # admin/components/crawler_manager.py:19) — der Weg laeuft nicht ueber nginx
    # und ist von dieser Regel nicht betroffen.
    # Kein proxy_pass noetig: deny greift, bevor weitergeleitet wird.
    # Ohne abschliessenden Slash, damit auch /api/crawler selbst faellt.
    # Nur Tourniquet — der dauerhafte Fix ist verify_admin_token an der Route
    # (Auflage A-2 im Verdikt, askvalentinai-kommunikation:
    # readme/architektur/reviews/PRUEFAUFTRAG_CRAWLER_REBUILD_ENDPOINT_AUTHZ_2026-07-27.md)
    location /api/crawler {
        deny all;
    }

    location /api/ {
        limit_req zone=chat_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # HEALTH & METRICS
    # ═══════════════════════════════════════════════════════════════════════════
    location /health {
        proxy_pass http://kommunikation-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /metrics {
        # R-137 (2026-08-19): Metrikflaeche traegt Mandantenkennungen
        # (u. a. israelitisches_krankenhaus_hh) und war von aussen ohne
        # Anmeldung lesbar. Belegt im Zugriffsprotokoll: 105 erfolgreiche
        # Abrufe zwischen 12.03. und 14.08.2026, elf davon nach der
        # IKH-Schaltung am 17.07. — der Weg war in Gebrauch, nicht nur offen.
        # Prometheus scrapt intern ueber app:8000, NICHT hierueber; der deny
        # bricht das Scraping nicht.
        # WARNUNG: nicht "oeffnen, damit es wieder geht".
        allow 172.20.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://kommunikation-app/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # CHAT WIDGET
    # ═══════════════════════════════════════════════════════════════════════════
    location /chat-widget/ {
        proxy_pass http://kommunikation-app/chat-widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # CHAT UI (Fullscreen)
    # ═══════════════════════════════════════════════════════════════════════════
    location /chat-ui/ {
        proxy_pass http://kommunikation-app/chat-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # STATIC FILES (AFTER monitor routes!)
    # ═══════════════════════════════════════════════════════════════════════════
    location /static/ {
        proxy_pass http://kommunikation-app/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # ACP / MCP DASHBOARD (Port 8503)
    # ═══════════════════════════════════════════════════════════════════════════
    # SEC-2 (2026-08-09): unauthentifizierter Zugriff extern belegt.
    # Kein proxy_pass noetig: deny greift vor der Weiterleitung.
    location /admin/cronjobs {
        deny all;
    }

    location /admin/acp/_stcore/ {
        proxy_pass http://kommunikation-acp/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /admin/acp/ {
        proxy_pass http://kommunikation-acp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # STREAMLIT ADMIN PANEL
    # ═══════════════════════════════════════════════════════════════════════════
    location /admin/ {
        proxy_pass http://kommunikation-streamlit/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/ {
        proxy_pass http://kommunikation-streamlit/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /component/ {
        proxy_pass http://kommunikation-streamlit/component/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # DEFAULT - All other requests to App
    # ═══════════════════════════════════════════════════════════════════════════
    location / {
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}