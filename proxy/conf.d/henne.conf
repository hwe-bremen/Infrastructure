# ═══════════════════════════════════════════════════════════════════════════════
# 🏭 HENNE VERPACKUNG - nginx Configuration
# Port: 443 (HTTPS) / 80 (HTTP)
# Domain: henne.askvalentinai.com
# ═══════════════════════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=henne_chat:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=henne_api:10m rate=20r/s;

upstream henne-app {
    server henne-app:8000;
    keepalive 32;
}

upstream henne-streamlit {
    server henne-app:8502;
    keepalive 8;
}

upstream henne-monitor {
    server henne-monitor:5054;
    keepalive 8;
}

upstream henne-grafana {
    server henne-grafana:3000;
    keepalive 8;
}

upstream henne-prometheus {
    server henne-prometheus:9090;
    keepalive 8;
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    server_name henne.askvalentinai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name henne.askvalentinai.com;

    ssl_certificate /etc/letsencrypt/live/henne.askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/henne.askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HenneSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https: blob: https://www.henneverpackung.de; connect-src 'self' https:; font-src 'self' https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), fullscreen=(self), payment=()" always;

    access_log /var/log/nginx/henne_access.log;
    error_log /var/log/nginx/henne_error.log;

    client_max_body_size 10M;

    # Trailing Slash Redirects
    location = /monitor  { return 301 $scheme://$host/monitor/; }
    location = /grafana  { return 301 $scheme://$host/grafana/; }
    location = /prometheus { return 301 $scheme://$host/prometheus/; }
    location = /admin    { return 301 $scheme://$host/admin/; }

    location /health {
        proxy_pass http://henne-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /metrics {
        allow 172.20.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://henne-app/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /chat {
        limit_req zone=henne_chat burst=10 nodelay;
        proxy_pass http://henne-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # Monitor VOR /static/ !
    location /monitor/ {
        proxy_pass http://henne-monitor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/css/monitor/ {
        proxy_pass http://henne-monitor/static/css/monitor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /static/js/monitor/ {
        proxy_pass http://henne-monitor/static/js/monitor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /grafana/ {
        proxy_pass http://henne-grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /grafana/api/live/ {
        proxy_pass http://henne-grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /prometheus/ {
        proxy_pass http://henne-prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /api/chat {
        limit_req zone=henne_chat burst=20 nodelay;
        proxy_pass http://henne-app/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/router-mini/ {
        limit_req zone=henne_api burst=30 nodelay;
        proxy_pass http://henne-app/api/router-mini/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=henne_api burst=30 nodelay;
        proxy_pass http://henne-app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://henne-app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    location /chat-widget/ {
        proxy_pass http://henne-app/chat-widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static NACH monitor routes!
    location /static/ {
        proxy_pass http://henne-app/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        proxy_pass http://henne-streamlit/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/ {
        proxy_pass http://henne-streamlit/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /component/ {
        proxy_pass http://henne-streamlit/component/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = / {
        return 301 /static/chat-ui/henne.html;
    }

    location / {
        proxy_pass http://henne-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~ /\.           { deny all; access_log off; log_not_found off; }
    location ~ ^/(\.env|docker-compose|Dockerfile) { deny all; access_log off; log_not_found off; }
    location = /favicon.ico  { log_not_found off; access_log off; proxy_pass http://henne-app/favicon.ico; }
    location = /robots.txt   { log_not_found off; access_log off; proxy_pass http://henne-app/robots.txt; }
}
```

---

**Struktur auf dem Server:**
```
/root/infrastructure/
├── proxy/
│   ├── docker-compose.yml    ← nginx-proxy + certbot
│   └── conf.d/
│       └── henne.conf        ← Henne nginx Config
