
# ═══════════════════════════════════════════════════════════════════════════════
# 📦 HENNE VERPACKUNG (Produktberater · M2-TENANT) - nginx Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Port: 14443 (HTTPS) / 14080 (HTTP) — in proxy/docker-compose.yml gemappt!
# Domain: henne.askvalentinai.com (Cloudflare DNS only, A -> 46.224.63.191)
# Backend: kommunikation-app (GETEILTER M2-Container, wie demo und khj)
# Identität: X-AVI-Client-Id=henne in JEDER Location (ADR-M2-001; überschreibt
#   jeden client-gelieferten Header). Dateiname, server_name und client_id
#   fallen hier zusammen — anders als bei ikh-askvalentinai.conf (server_name
#   khj), wo der Dateiname der internen client_id folgt.
# Kundenlink: https://henne.askvalentinai.com:14443/chat-ui/henne.html
#   Der Port steht drin, weil auf diesem Host nichts auf 80/443 lauscht
#   (R-189) — alle Mandanten laufen auf 1x080/1x443.
#
# Betreiber-Entscheidungen 2026-09-04 (Arbeitsplan §7, askvalentinai-
# kommunikation-Repo, ARBEITSPLAN_HENNE_HETZNER_SCHARFSCHALTEN_2026-09-04.md):
#   E-3 KEINE IP-Allowlist, KEINE Basic-Auth. Bewusst anders als khj: dort ist
#       es eine geschlossene Testumgebung im Medizinkontext, hier geht der Link
#       an einen Kunden mit unbekannter IP. Eine Allowlist wuerde ihn aussperren.
#       Folge: /chat und /api/chat sind unauthentifiziert erreichbar — das ist
#       die Kostenflaeche (Modellaufrufe). Die Ratenbegrenzung unten ist dagegen
#       das einzige Mittel; wenn der Link breiter gestreut wird, gehoert das neu
#       bewertet.
#   E-4 X-Robots-Tag noindex — Vorschau, soll nicht in Suchergebnissen stehen.
#   E-5 /chat-ui/index.html gesperrt: diese Seite traegt eine Themenleiste mit
#       den Namen ANDERER Mandanten (Default / Henne / Medical / Corporate /
#       Hofmann). Auf einem Kundenlink hat das nichts zu suchen.
# ═══════════════════════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=henne_chat:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=henne_api:10m rate=20r/s;

server {
    listen 14080;
    server_name henne.askvalentinai.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host:14443$request_uri; }
}

server {
    listen 14443 ssl;
    http2 on;
    server_name henne.askvalentinai.com;

    ssl_certificate /etc/letsencrypt/live/henne.askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/henne.askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HenneSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # E-4: Kundenvorschau, nicht indexieren
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/henne_askvalentinai_access.log;
    error_log /var/log/nginx/henne_askvalentinai_error.log;

    location /chat {
        proxy_set_header X-AVI-Client-Id henne;   # M2-Identität
        limit_req zone=henne_chat burst=10 nodelay;
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /api/chat {
        proxy_set_header X-AVI-Client-Id henne;   # M2-Identität
        limit_req zone=henne_chat burst=20 nodelay;
        proxy_pass http://kommunikation-app/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_set_header X-AVI-Client-Id henne;   # M2-Identität
        proxy_pass http://kommunikation-app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ── SEC-1 / SEC-2 — uebernommen aus ikh-askvalentinai.conf ───────────────
    # Dieser Block proxyt auf denselben kommunikation-app-Container wie
    # chat.askvalentinai.com. routes/crawler.py wertet X-AVI-Client-Id NICHT
    # aus (kein Import von config.request_tenant) und loest ueber den
    # Prozess-Default auf — ein Rebuild ueber DIESE Domain loescht daher die
    # Daten von client_data/kommunikation, nicht die von henne. Deshalb faellt
    # der Pfad auch hier. Kein proxy_pass noetig: deny greift vor der
    # Weiterleitung. Kein `satisfy all` noetig wie bei khj — hier gibt es
    # weder Basic-Auth noch Allowlist, die man damit umgehen koennte (E-3).
    location /admin {
        deny all;
    }

    location /api/crawler {
        deny all;
    }

    # ── E-5 — Themenleiste nicht ausliefern ─────────────────────────────────
    # /chat-ui/index.html traegt einen Umschalter mit den Namen anderer
    # Mandanten. `location =` (exakt), damit nur diese eine Datei faellt.
    # Zusaetzlich der Verzeichnis-Aufruf, der sonst index.html ausliefert.
    location = /chat-ui/index.html { deny all; }
    location = /chat-ui/          { deny all; }

    location /api/ {
        proxy_set_header X-AVI-Client-Id henne;   # M2-Identität
        limit_req zone=henne_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_set_header X-AVI-Client-Id henne;   # harmlos/safe
        proxy_pass http://kommunikation-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /chat-widget/ {
        proxy_set_header X-AVI-Client-Id henne;   # M2-Identität
        proxy_pass http://kommunikation-app/chat-widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat-ui/ {
        proxy_set_header X-AVI-Client-Id henne;   # M2-Identität (Henne-Frontend-Entry)
        proxy_pass http://kommunikation-app/chat-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        # add_header im location-Block ersetzt die server-Level-Header → noindex hier wiederholen
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /static/ {
        proxy_set_header X-AVI-Client-Id henne;   # M2-Identität
        proxy_pass http://kommunikation-app/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_set_header X-AVI-Client-Id henne;   # M2-Identität (catch-all)
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
