
# ═══════════════════════════════════════════════════════════════════════════════
# 🏥 KHJ TESTUMGEBUNG (Krankenhaus Jerusalem · M2-TENANT) - nginx Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Port: 12443 (HTTPS) / 12080 (HTTP) — NEU, in proxy/docker-compose.yml gemappt!
# Domain: khj.askvalentinai.com (via Cloudflare DNS, analog chat/demo)
# Backend: kommunikation-app (GETEILTER M2-Container, Test-/Abnahme-Topologie)
# Identität: X-AVI-Client-Id=israelitisches_krankenhaus_hh in JEDER Location
#   (ADR-M2-001; überschreibt jeden client-gelieferten Header)
# HINWEIS: Öffentliche Domain ist khj (Krankenhaus Jerusalem). Die INTERNE
#   client_id bleibt bewusst 'israelitisches_krankenhaus_hh' bis zum M1-Umzug
#   (S-19) — KEIN In-Place-Rename auf M2 (bricht die per-Tenant Audit-Chain).
# BEFRISTET: Rollout-/Abnahme-Phase. Bei Scharfschaltung zieht KHJ auf eigenen
#   M1-Container/eigenen Server um (Backlog S-19) → diese Datei wird entfernt.
# Schutz: IP-Allowlist (A-113-3, seit 2026-08-21) fuer die gesamte Zone +
#   X-Robots-Tag noindex (Medizin-Kontext, unfertige Inhalte).
#   Basic-Auth (htpasswd_ikh) TEMPORAER DEAKTIVIERT ab 2026-08-20, Ursache
#   ungeklaert (§111/§114) -- IP-Allowlist ist der Ersatz, nicht nur eine
#   Ergaenzung. /api/v1/feed/abholen hat eine eigene, unabhaengige
#   Absicherung und ist von beidem ausgenommen (siehe Block dort).
# Referenz: readme/_active/ARBEITSPLAN_IKH_TEST_ERREICHBARKEIT_2026-07-17.md
#   (askvalentinai-kommunikation-Repo), Smoke-Matrix §5.
# ═══════════════════════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=ikh_chat:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ikh_api:10m rate=20r/s;

server {
    listen 12080;
    server_name khj.askvalentinai.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host:12443$request_uri; }
}

server {
    listen 12443 ssl;
    http2 on;
    server_name khj.askvalentinai.com;

    ssl_certificate /etc/letsencrypt/live/khj.askvalentinai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khj.askvalentinai.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:IkhSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Testphasen-Schutz: nicht indexieren
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── Basic-Auth TEMPORÄR DEAKTIVIERT, 2026-08-20 ──────────────────────────
    # War: Testphasen-Schutz fuer den GESAMTEN 12443-Block (htpasswd_ikh, nur
    # auf der VM, nie im Repo). Deaktiviert fuer PR 6b / Matthias' Trigger-
    # Integration (kundenseitiger Feed-Ausloeser, POST /api/v1/feed/abholen).
    #
    # Grund: Live-Fehlersuche am 2026-08-20 (Abnahmelauf PR 6b, Code-Abteilung
    # + Hawe) hat fuenf moegliche Ursachen einzeln ausgeschlossen, ohne die
    # tatsaechliche zu finden:
    #   - Hash falsch/inkonsistent -> ausgeschlossen (openssl passwd -apr1
    #     UND {SHA}-Format probiert, rechnerisch byte-identisch mit dem
    #     gespeicherten Hash verglichen -- beide Male trotzdem 401)
    #   - alte/doppelte Config-Datei -> ausgeschlossen (nur eine
    #     auth_basic_user_file-Stelle in dieser Datei, keine andere Config
    #     referenziert "khj")
    #   - Reload nicht ausgefuehrt -> ausgeschlossen (Worker-Prozess-Alter
    #     vor/nach explizit verglichen, frische Worker nach jedem Reload)
    #   - Location-Block ueberschreibt server-weite auth_basic -> ausge-
    #     schlossen (grep zeigt nur die eine auth_basic-Stelle in der Datei)
    #   - versteckte Zeichen in der htpasswd-Datei (CR, Leerzeichen) ->
    #     ausgeschlossen (od -c gegengeprueft)
    # Root Cause nicht gefunden. Moeglich: etwas ausserhalb dieser Datei
    # (globale nginx.conf-Direktive?) oder eine nginx/Alpine-Eigenheit, die
    # mit den bisherigen Mitteln nicht sichtbar wurde.
    #
    # Das ist vertretbar, weil Basic-Auth hier ohnehin nur ein zusaetzlicher
    # Testphasen-Schutz war -- die eigentliche Autorisierung fuer
    # /api/v1/feed/abholen macht der Bearer-Token (eigener Redis-Schluessel-
    # raum, siehe routes/feed_abholung.py im askvalentinai-kommunikation-
    # Repo), nicht diese Schicht hier.
    #
    # Vollstaendige Fehlersuche dokumentiert im Chat-Verlauf der PR-6b-
    # Abnahmesitzung, 2026-08-20 (askvalentinai-kommunikation-Repo,
    # readme/_active/STEP_SCHEDULER_CRON_STRANG_UMLAUF_2026-08-08.md, §110).
    #
    # Wieder aktivieren: die zwei auskommentierten Zeilen unten entkommentieren,
    # `docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload`.
    # auth_basic           "KHJ Testumgebung";
    # auth_basic_user_file /etc/nginx/conf.d/htpasswd_ikh;

    # A-113-3 (§113.2/§113.4, Review-Endabnahme 2026-08-21): das Ersatzmittel
    # fuer die oben deaktivierte Basic-Auth. Grundsatz: eine Schutzschicht
    # wird nicht abgeschaltet, sie wird ersetzt -- IP-Allowlist fuer die
    # GESAMTE 12443-Zone (server-weit, dieselbe Reichweite wie die Basic-Auth,
    # die sie ersetzt). Betrifft auch /chat und /api/chat, den in §113.4/
    # §113.5 benannten Kostenrisiko-Pfad (unauthentifizierte Modellaufrufe).
    #
    # Praefix statt Einzeladresse: macOS/viele Heimanschluesse nutzen IPv6
    # Privacy Extensions (rotierende "temporary"-Adressen, typ. alle 24h).
    # Das /64-Praefix bleibt stabil, solange sich am Anschluss nichts
    # aendert -- deckt sowohl die "secured"- als auch die "temporary"-
    # Adresse desselben Geraets ab (live gegengeprueft, 2026-08-21).
    allow 2003:f7:e748:c00::/64;   # Hawe, Vorgangsverantwortlicher, Buero
    # TODO: Hawe, M4-Home-Praefix ergaenzen (noch nicht ermittelt, 2026-08-21)
    # TODO: Matthias' IP/Praefix ergaenzen, sobald bekannt (A-113-3, offen)
    deny all;

    access_log /var/log/nginx/khj_askvalentinai_access.log;
    error_log /var/log/nginx/khj_askvalentinai_error.log;

    location /chat {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # M2-Identität
        limit_req zone=ikh_chat burst=10 nodelay;
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location /api/chat {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # M2-Identität
        limit_req zone=ikh_chat burst=20 nodelay;
        proxy_pass http://kommunikation-app/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 120s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # M2-Identität
        proxy_pass http://kommunikation-app/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ── SEC-1 (2026-07-27) ──────────────────────────────────────────────────
    # Dieser Block proxyt auf denselben kommunikation-app-Container wie
    # chat.askvalentinai.com. routes/crawler.py wertet X-AVI-Client-Id NICHT
    # aus (kein Import von config.request_tenant) und loest ueber den
    # Prozess-Default auf — ein Rebuild ueber DIESE Domain loescht daher die
    # Daten von client_data/kommunikation, nicht die des hier gesetzten
    # Tenants. Deshalb faellt der Pfad auch hier, nicht nur am Hauptblock.
    # Kein proxy_pass noetig: deny greift, bevor weitergeleitet wird.
    # SEC-2 (2026-08-09): unauthentifizierter Zugriff extern belegt.
    # Kein proxy_pass noetig: deny greift vor der Weiterleitung.
    location /admin {
        deny all;
    }

    location /api/crawler {
        deny all;
    }

    # A-113-3, Nachtrag (2026-08-21): /api/v1/feed/abholen hat eine EIGENE
    # Absicherung, unabhaengig von dieser Zone -- Bearer-Token, gehasht,
    # fail-closed, ratenbegrenzt (routes/feed_abholung.py, PR 6b,
    # askvalentinai-kommunikation-Repo). Die aeussere Sperre (IP-Allowlist,
    # Basic-Auth deaktiviert) schuetzt eigentlich nur Pfade OHNE eigene
    # Pruefung (/chat, /api/chat -- die Kostenflaeche aus §113.5 des
    # Review-Verdikts). Dieser eine, exakte Pfad wird deshalb bewusst
    # ausgenommen, alles andere in /api/ bleibt gesperrt. `location =`
    # (exakt), damit kein anderer Pfad ueber einen Praefix-Treffer mit
    # ausgenommen wird.
    location = /api/v1/feed/abholen {
        auth_basic off;
        allow all;
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;
        limit_req zone=ikh_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/v1/feed/abholen;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # M2-Identität
        limit_req zone=ikh_api burst=30 nodelay;
        proxy_pass http://kommunikation-app/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # harmlos/safe
        proxy_pass http://kommunikation-app/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /chat-widget/ {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # M2-Identität
        proxy_pass http://kommunikation-app/chat-widget/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat-ui/ {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # M2-Identität (IKH-Frontend-Entry)
        proxy_pass http://kommunikation-app/chat-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
        # add_header im location-Block ersetzt die server-Level-Header → noindex hier wiederholen
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /static/ {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # M2-Identität
        proxy_pass http://kommunikation-app/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_set_header X-AVI-Client-Id israelitisches_krankenhaus_hh;   # M2-Identität (catch-all)
        proxy_pass http://kommunikation-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
