# ═══════════════════════════════════════════════════════════════════════════════
# UPSTREAMS · geteilter M2-Container kommunikation-app
# ═══════════════════════════════════════════════════════════════════════════════
# Herkunft: Diese fuenf Bloecke standen bis 2026-09-14 in kommunikation.conf,
# dem duckdns-Block. Beim Entfernen jenes Blocks (R-257) fielen sie mit weg und
# "nginx -t" brach ab: chat-askvalentinai.conf:325 verweist auf
# kommunikation-acp. Aufgefallen VOR dem Reload, die Produktion war nie berührt.
#
# Lehre, hier festgehalten: Eine Mandanten-Conf darf nichts definieren, das
# andere Mandanten brauchen. Upstreams gehoeren in eine eigene Datei, damit das
# Entfernen eines Mandanten nur diesen Mandanten trifft.
#
# Ein Container, mehrere Dienste (siehe R-260): kommunikation-app faehrt
# :8000 FastAPI, :8502 Streamlit-Panel, :8503 ACP-Dashboard.
#
# Unveraendert uebernommen -- keine Werte angepasst. kommunikation-grafana und
# kommunikation-prometheus werden derzeit von keinem Block referenziert; sie
# bleiben zunaechst stehen, damit dieser Reparaturschritt nichts ausser der
# Wiederherstellung tut. Aufraeumen gehoert zu Schritt 3.
# ═══════════════════════════════════════════════════════════════════════════════

upstream kommunikation-app {
    server kommunikation-app:8000;
    keepalive 32;
}

upstream kommunikation-streamlit {
    server kommunikation-app:8502;
    keepalive 8;
}

upstream kommunikation-acp {
    server kommunikation-app:8503;
    keepalive 8;
}

upstream kommunikation-grafana {
    server kommunikation-grafana:3000;
    keepalive 8;
}

upstream kommunikation-prometheus {
    server kommunikation-prometheus:9090;
    keepalive 8;
}
