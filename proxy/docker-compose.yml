version: '3.8'
# ============================================
# nginx-proxy - Multi-Client Reverse Proxy
# ============================================
# Stand 2026-06-16: Altlasten-Clients (askvalentin, holzring, hofmann,
# hofmann-usa, bek) stillgelegt. Aktive Domains:
#   - chat.askvalentinai.com + askvalentinai-chat.duckdns.org  -> 10080/10443
#   - demo.askvalentinai.com (ehem. BEK-Slot, von demo wiederverwendet) -> 11080/11443
#   - ikh.askvalentinai.com (IKH-Testumgebung, befristet Rollout/Abnahme) -> 12080/12443
# Behaltene Netze: proxy_net (u.a. demo-app-Notnagel) + chat_net (kommunikation-app).
services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped

    ports:
      - "10080:10080"   # HTTP  Chat / Kommunikation
      - "10443:10443"   # HTTPS Chat / Kommunikation
      - "11080:11080"   # HTTP  demo (ehem. BEK-Slot)
      - "11443:11443"   # HTTPS demo (ehem. BEK-Slot)
      - "12080:12080"   # HTTP  IKH-Testumgebung (befristet, S-19: bei Scharfschaltung entfernen)
      - "12443:12443"   # HTTPS IKH-Testumgebung (befristet)
    volumes:
      # nginx Configs
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      # SSL Zertifikate (Let's Encrypt)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
      # Logs
      - ./logs:/var/log/nginx
    networks:
      - proxy_net
      - chat_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  proxy_net:
    external: true
  chat_net:
    external: true
